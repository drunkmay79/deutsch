<title>Gutachter-Deutsch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Literata:opsz,wght@7..72,400;7..72,600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: eine Lernspalte (max. 720px) wie ein Gutachtenblatt; feste Navigation unten.
   Farben: Papier mit leichtem Grünstich, Tinte, Katasterlinien-Petrol als Akzent, Textmarker-Gelb für Lücken. */
:root {
  --paper: #f5f6f2;
  --sheet: #ffffff;
  --ink: #18201f;
  --ink2: #4b5754;
  --line: #d9ded8;
  --accent: #0e5c5a;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe8;
  --mark: #fbe78a;
  --ok: #1f7a3d;
  --ok-soft: #e1f2e5;
  --warn: #9a6200;
  --warn-soft: #fbefd6;
  --bad: #b3261e;
  --bad-soft: #f9e2df;
  --der: #2357a6;
  --die: #b0303a;
  --das: #2a7a3a;
  --shadow: 0 1px 2px rgba(20, 40, 38, .06), 0 4px 14px rgba(20, 40, 38, .05);
  --f-ui: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-doc: "Literata", Georgia, "Times New Roman", serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --f-disp: "Unbounded", "Golos Text", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121716; --sheet: #1a2120; --ink: #e8eeec; --ink2: #a5b3af; --line: #2d3836;
    --accent: #5fbcb5; --accent-ink: #0b1514; --accent-soft: #1f3533; --mark: #6b5a12;
    --ok: #6cc98a; --ok-soft: #173223; --warn: #e4b257; --warn-soft: #3a2e14; --bad: #f08a80; --bad-soft: #3d1e1b;
    --der: #8db4f0; --die: #f08f97; --das: #87d39a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121716; --sheet: #1a2120; --ink: #e8eeec; --ink2: #a5b3af; --line: #2d3836;
  --accent: #5fbcb5; --accent-ink: #0b1514; --accent-soft: #1f3533; --mark: #6b5a12;
  --ok: #6cc98a; --ok-soft: #173223; --warn: #e4b257; --warn-soft: #3a2e14; --bad: #f08a80; --bad-soft: #3d1e1b;
  --der: #8db4f0; --die: #f08f97; --das: #87d39a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 16px/1.5 var(--f-ui); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
* { box-sizing: border-box; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.25; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top .inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.brand { font: 600 15px/1.2 var(--f-disp); letter-spacing: .01em; }
.brand small { display: block; font: 400 12px/1.2 var(--f-ui); color: var(--ink2); letter-spacing: 0; }
#sync { margin-left: auto; width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
#sync.on { background: var(--ok); }

main {
  max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
  padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main > * { min-width: 0; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--sheet); border-top: 1px solid var(--line);
  display: flex; justify-content: center; gap: 4px;
  padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav button { flex: 1 1 0; max-width: 140px; background: none; border: 0; border-radius: 8px; padding: 8px 4px; font-size: 13px; color: var(--ink2); cursor: pointer; }
.nav button.on { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
.muted { color: var(--ink2); }
.small { font-size: 14px; }
.ru { color: var(--ink2); }
.ru.big { color: var(--ink); }
.big { font-size: 20px; line-height: 1.4; }
.doc { font-family: var(--f-doc); }
.hint { font-size: 14px; color: var(--ink2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.note { background: var(--warn-soft); border-radius: var(--r); padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
.viewtitle { font: 600 24px/1.2 var(--f-disp); }
.sub { font-size: 17px; font-weight: 600; margin-top: 8px; }
h3 { font-size: 19px; }
h4 { font-size: 16px; margin-top: 6px; }
mark, .gap { background: var(--mark); color: var(--ink); border-radius: 3px; padding: 0 3px; }

/* Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--sheet); cursor: pointer; font-weight: 500; text-align: center; }
.btn:hover { border-color: var(--ink2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn:disabled { opacity: .55; cursor: default; }
label.btn input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
label.btn { position: relative; }
label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-icon { width: 40px; height: 40px; flex: none; display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); color: var(--accent); cursor: pointer; }
.ic { display: inline-grid; width: 22px; height: 22px; }
.ic.sm { width: 18px; height: 18px; }
.ic svg { width: 100%; height: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.end { justify-content: flex-end; }

/* Heute */
.dayhead { display: flex; flex-direction: column; gap: 6px; }
.dayline { display: flex; align-items: center; gap: 16px; }
.daynum { font: 700 44px/1 var(--f-disp); color: var(--accent); white-space: nowrap; }
.daynum span { font-size: 18px; font-weight: 500; color: var(--ink2); }
.daytitle { font-size: 19px; font-weight: 600; }
.stichtag { font: 13px/1.4 var(--f-num); color: var(--ink2); }
.daynav { display: flex; justify-content: space-between; gap: 8px; }
.sessions { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.session { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.session.done { opacity: .8; }
.sesshead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sesshead h2 { font-size: 18px; }
.pill { font: 12px/1 var(--f-num); padding: 5px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.blocks { margin: 0; padding: 0; list-style: none; counter-reset: b; display: flex; flex-direction: column; }
.blocks li { counter-increment: b; display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px dashed var(--line); }
.blocks li::before { content: counter(b) "."; font: 13px var(--f-num); color: var(--ink2); width: 18px; flex: none; }
.blocks li.ok::before { content: "✓"; color: var(--ok); font-weight: 700; }
.bname { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bname small { color: var(--ink2); font-size: 12.5px; }
.bmin { font: 13px var(--f-num); color: var(--ink2); white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font: 600 20px/1.2 var(--f-num); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--ink2); }

/* Sitzung */
.runhead { display: flex; flex-direction: column; gap: 10px; }
.runbar { display: flex; align-items: center; gap: 10px; }
.runtitle { font-weight: 600; flex: 1; min-width: 0; }
.clock { font: 14px var(--f-num); color: var(--ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock.reached { color: var(--ok); font-weight: 600; }
.pips { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; }
.pips button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--sheet); font: 13px var(--f-num); cursor: pointer; }
.pips li.ok button { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.pips li.cur button { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.blockhead h2 { font-size: 21px; }
.blockhead .num { font-family: var(--f-num); color: var(--accent); }
.block { display: flex; flex-direction: column; gap: 14px; }
.block > div:first-child { display: flex; flex-direction: column; gap: 14px; }
.blockfoot { display: flex; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 10px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.counter { font: 13px var(--f-num); color: var(--ink2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 6px 12px; font-size: 14px; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.stage { display: flex; flex-direction: column; gap: 14px; }
.rcard, .scen, .panel, .eval, .fb, .timerbox { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.result { display: flex; flex-direction: column; gap: 10px; }
.result:empty { display: none; }
.instr { font-weight: 600; }
.wrongline { text-decoration: line-through; text-decoration-color: var(--bad); color: var(--ink2); }
.verdict { border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
p.verdict { flex-direction: row; align-items: center; gap: 6px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.near { background: var(--warn-soft); }
.verdict.wrong { background: var(--bad-soft); }
.verdict .doc { color: var(--ink); }
.expl { background: var(--accent-soft); border-radius: var(--r); padding: 10px 12px; color: var(--ink); }

/* Wortkarte */
.wcard { display: flex; flex-direction: column; gap: 8px; }
.word { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.word .de { font: 600 24px/1.25 var(--f-doc); }
.art { font: 600 15px var(--f-num); }
.art-der { color: var(--der); } .art-die { color: var(--die); } .art-das { color: var(--das); }
.word .art { font-size: 18px; }
.meta { font: 13.5px var(--f-num); color: var(--ink2); }
.ex { display: flex; gap: 8px; align-items: flex-start; border-left: 3px solid var(--accent-soft); padding-left: 10px; }
.ex p { flex: 1; min-width: 0; }
.col { margin: 0; padding-left: 18px; font-family: var(--f-doc); font-size: 15px; color: var(--ink2); }
.note { margin: 0; }
.wcard .note { background: none; padding: 0; color: var(--warn); }

.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.grade { border: 1px solid var(--line); background: var(--sheet); border-radius: var(--r); padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; min-height: 52px; }
.grade small { font: 11.5px var(--f-num); color: var(--ink2); }
.grade.g1 b { color: var(--bad); } .grade.g2 b { color: var(--warn); } .grade.g3 b { color: var(--ok); } .grade.g4 b { color: var(--accent); }
.grade.primary { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--sheet); border-radius: var(--r); padding: 11px 14px; cursor: pointer; min-height: 44px; }
.choice.right { background: var(--ok-soft); border-color: var(--ok); }
.choice.wrong { background: var(--bad-soft); border-color: var(--bad); }
textarea.answer, input.search, .form input[type=text], select { width: 100%; border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--paper); font-size: 17px; resize: vertical; }
textarea.answer.doc { font-family: var(--f-doc); font-size: 16px; line-height: 1.55; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--sheet); border-radius: 14px; padding: 6px 12px; font-size: 14.5px; cursor: pointer; font-family: var(--f-doc); text-align: left; max-width: 100%; }
details.scenmini { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
details.scenmini .scen { border: 0; box-shadow: none; padding: 8px 0 0; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); }
.chip.static { cursor: default; }
.built { min-height: 48px; border: 1px dashed var(--ink2); border-radius: var(--r); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; }

/* Regel */
details.rule, details.model, details.pitchref { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
details summary { cursor: pointer; font-weight: 600; }
details[open] summary { margin-bottom: 10px; }
.rulebody { font-size: 15.5px; line-height: 1.6; display: flex; flex-direction: column; gap: 8px; }
.rulebody table, .tbl { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.rulebody td, .rulebody th, .tbl td, .tbl th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.rulebody ul { margin: 0; padding-left: 20px; }
.rulebody { overflow-x: auto; }
.tbl tr.weak td { color: var(--bad); }
.examples { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 8px; }
.examples li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.examples li .ru { grid-column: 1; }
.examples li .btn-icon { grid-row: 1 / span 2; grid-column: 2; }

/* Text */
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps button { border: 1px solid var(--line); background: var(--sheet); border-radius: 99px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.steps button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.doc-title { font-family: var(--f-doc); font-size: 21px; }
.para { display: flex; gap: 8px; align-items: flex-start; background: var(--sheet); padding: 12px; border-radius: var(--r); border: 1px solid var(--line); }
.para p { flex: 1; min-width: 0; line-height: 1.65; }
.gloss { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 14.5px; }
.gloss dt { font-family: var(--f-doc); } .gloss dd { margin: 0; color: var(--ink2); }
.mcq { display: flex; flex-direction: column; gap: 8px; }
label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink2); }
label.inline select { width: auto; padding: 6px 8px; font-size: 14px; }

/* Gespräch */
.facts { background: var(--accent-soft); border-radius: var(--r); padding: 10px 12px; }
.chat { display: flex; flex-direction: column; gap: 12px; }
.log { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; position: relative; }
.msg.them { background: var(--sheet); border: 1px solid var(--line); align-self: flex-start; font-family: var(--f-doc); }
.msg.me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; }
.msg .btn-icon { width: 32px; height: 32px; align-self: flex-start; }
.msg .fix { font-size: 15px; background: var(--ok-soft); color: var(--ink); border-radius: 8px; padding: 6px 8px; font-family: var(--f-ui); }
.fixlabel { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ok); }
.msg.pending p { color: var(--ink2); }
.composer { display: flex; flex-direction: column; gap: 8px; position: sticky; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); background: var(--paper); padding-top: 8px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink2); }
.scores { display: flex; flex-direction: column; gap: 6px; }
.score { display: grid; grid-template-columns: minmax(0, 9em) 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.score b { font: 13px var(--f-num); }
.picks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.picks label { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: var(--r); padding: 10px; cursor: pointer; }
.picks label > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.picks input { margin-top: 4px; width: 18px; height: 18px; flex: none; }
.better { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.better li { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; border-left: 3px solid var(--accent-soft); padding-left: 10px; }
.better li .btn-icon { grid-row: 1 / span 2; grid-column: 2; }
.model { border-left: 3px solid var(--accent); padding-left: 12px; display: flex; flex-direction: column; gap: 6px; }
details.model { border-left: 3px solid var(--accent); }
.scoreline { font: 600 15px var(--f-num); color: var(--accent); }
.partners { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.partner { text-align: left; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; box-shadow: var(--shadow); min-height: 84px; }
.partner b { font-size: 16px; }
.partner .pill { align-self: flex-start; }

/* 4/3/2 */
.points { margin: 0; padding-left: 20px; font-family: var(--f-doc); display: flex; flex-direction: column; gap: 4px; }
.timerbox { align-items: center; text-align: center; }
.timer { font: 600 56px/1 var(--f-num); font-variant-numeric: tabular-nums; color: var(--accent); }
.shadow { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.shadowlist { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.shadowlist li { padding: 4px 6px; border-radius: 8px; }
.shadowlist li > * { vertical-align: middle; }
.shadowlist li p { display: inline; margin-right: 8px; }
.shadowlist li .btn-icon { width: 32px; height: 32px; }
.shadowlist li.on { background: var(--mark); }

/* Leere Zustände, Abschluss */
.empty { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.finish h2 { font: 600 24px/1.2 var(--f-disp); }
.genstatus { margin: 0; padding-left: 20px; font-size: 14px; }
.genstatus li.ok { color: var(--ok); } .genstatus li.err { color: var(--bad); }

/* Karten, Plan */
.voclist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.voclist li { display: grid; grid-template-columns: auto minmax(0, 1.2fr) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.vde { font-family: var(--f-doc); overflow-wrap: anywhere; }
.vru { color: var(--ink2); font-size: 14px; overflow-wrap: anywhere; }
.voclist .btn-icon { width: 32px; height: 32px; }
.lvl { font: 11px var(--f-num); padding: 3px 6px; border-radius: 6px; background: var(--line); }
.lvl.lernt { background: var(--warn-soft); color: var(--warn); }
.lvl.sicher { background: var(--ok-soft); color: var(--ok); }
.chartbox { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.chart { width: 100%; height: auto; display: block; }

  "de": "2.1 Makrolage\n\nMusterstadt ist eine kreisfreie Stadt im westlichen Ruhrgebiet in Nordrhein-Westfalen und gehört zum Ballungsraum Rhein-Ruhr. Die Stadt hat rund 160.000 Einwohner. Die Bevölkerungszahl ist seit einigen Jahren weitgehend stabil; die Bevölkerungsprognose geht bis 2040 von einem leichten Rückgang aus.\n\nNach dem Ende des Steinkohlenbergbaus hat ein tiefgreifender Strukturwandel stattgefunden. Heute prägen Logistik, Handel, Gesundheitswirtschaft und mittelständische Industriebetriebe den Standort. Die Arbeitslosenquote liegt mit rund 9 % über dem Landesdurchschnitt, die Kaufkraft leicht darunter.\n\nDie Verkehrsanbindung ist sehr gut. Im Stadtgebiet befinden sich zwei Autobahnanschlüsse, über die die benachbarten Großstädte in 15 bis 30 Minuten erreichbar sind. Der Hauptbahnhof bietet Regionalexpress-Verbindungen in alle größeren Städte der Region. Der nächste internationale Flughafen ist in etwa 35 Minuten erreichbar.\n\nDer Wohnimmobilienmarkt ist insgesamt ausgeglichen. Nachgefragt werden vor allem Einfamilienhäuser und modernisierte Eigentumswohnungen in den südlichen Stadtteilen. Nach einer Phase stark steigender Preise bis 2022 waren die Kaufpreise infolge des Zinsanstiegs zunächst rückläufig; seit 2024 stabilisieren sie sich auf etwas niedrigerem Niveau.\n\nFazit: Musterstadt ist ein durchschnittlicher Wohnstandort mit sehr guter Verkehrsanbindung, aber leicht unterdurchschnittlichen sozioökonomischen Kennzahlen.",

  "de": "2.2 Mikrolage\n\nDas Bewertungsobjekt Lindenweg 12 liegt im Stadtteil Südfeld, etwa 4 km südlich der Innenstadt, in einer ruhigen Anliegerstraße. Die Umgebung ist geprägt von freistehenden Einfamilienhäusern und Doppelhäusern aus den 1960er- bis 1990er-Jahren in offener Bauweise. Geschäfte des täglichen Bedarfs, eine Grundschule und mehrere Kindertagesstätten sind in 5 bis 10 Gehminuten erreichbar. Die nächste Bushaltestelle befindet sich in rund 300 m Entfernung; der Hauptbahnhof ist mit dem Bus in etwa 15 Minuten erreichbar. Besondere Immissionen sind nicht bekannt; lediglich bei Westwind ist zeitweise Verkehrslärm der rund 800 m entfernten Bundesstraße wahrnehmbar. Insgesamt handelt es sich um eine mittlere bis gute Wohnlage.\n\n2.3 Grundstück\n\nDas Grundstück (Gemarkung Südfeld, Flur 7, Flurstück 245) ist 612 m² groß und hat einen nahezu rechteckigen Zuschnitt. Die Straßenfront beträgt etwa 18 m, die Tiefe rund 34 m. Das Gelände ist weitgehend eben. Das Grundstück ist ortsüblich erschlossen und an Wasser, Abwasser, Strom, Gas und Telekommunikation angeschlossen. Nach Auskunft der Stadt sind keine Erschließungsbeiträge mehr offen. Ein Bebauungsplan existiert nicht; die Bebaubarkeit richtet sich nach § 34 BauGB. Im Baulastenverzeichnis sind keine Eintragungen vorhanden. Altlasten sind nach Auskunft aus dem Altlastenkataster nicht bekannt.",

  "de": "Vor einem Monat hatte ich mein Vorstellungsgespräch für eine Stelle als Gutachter bei einer Sparkasse. Da ich vorher sehr nervös war, möchte ich meine Erfahrungen hier teilen. Vielleicht helfen sie jemandem.\n\nDas Gespräch dauerte etwa eine Stunde. Mir gegenüber saßen eine Personalreferentin und der Leiter der Abteilung Kreditsicherheiten. Nach kurzem Small Talk über die Anfahrt sollte ich mich vorstellen. Ich hatte meine Selbstpräsentation zu Hause oft laut geübt, deshalb lief dieser Teil gut.\n\nSchwieriger wurde es bei den Fachfragen. Der Abteilungsleiter wollte wissen, wie ich den Unterschied zwischen Marktwert und Beleihungswert erkläre und welches Verfahren ich für ein vermietetes Mehrfamilienhaus wählen würde. Bei einer Frage zur BelWertV fiel mir ein Begriff nicht ein. Ich habe ehrlich gesagt: „Mir fehlt gerade das genaue Wort, aber ich beschreibe es Ihnen.“ Das war überhaupt kein Problem.\n\nDanach kam eine Situationsfrage: Ein Kreditberater möchte einen höheren Wert, weil der Kunde sonst zu einer anderen Bank geht. Ich habe erklärt, dass ich neue Argumente gern prüfe, in meinem Urteil aber unabhängig bleiben muss. Der Abteilungsleiter nickte zufrieden.\n\nAm Ende habe ich nach der Einarbeitung und der Software gefragt. Mein Tipp: Sprechen Sie langsam und lieber in einfachen Sätzen. Niemand erwartet perfektes Deutsch, aber man muss fachlich sicher und verständlich sein. Zwei Wochen später kam die Zusage.",

  "de": "3.1 Gebäudebeschreibung\n\nGebäudeart: freistehendes Einfamilienhaus, eingeschossig mit ausgebautem Dachgeschoss, voll unterkellert; nach NHK 2010 Gebäudeart 1.01.\n\nBaujahr: 1972 laut Bauakte; Modernisierungen siehe Abschnitt 3.2.\n\nBauweise und Konstruktion: Das Gebäude wurde in massiver Bauweise errichtet. Die Kelleraußenwände bestehen aus Beton. Die Außenwände der Geschosse sind als zweischaliges Mauerwerk aus Kalksandstein mit Klinkervorsatzschale ausgeführt. Die Geschossdecken sind Stahlbetondecken. Das Satteldach hat einen Holzdachstuhl und ist mit Betondachsteinen eingedeckt.\n\nRaumaufteilung: Im Erdgeschoss befinden sich Diele, Gäste-WC, Küche sowie ein großzügiger Wohn- und Essbereich mit Zugang zur Terrasse. Im Dachgeschoss liegen drei Schlafzimmer und das Bad. Der Keller umfasst einen Heizungsraum, einen Hauswirtschaftsraum und zwei Abstellräume. Die Grundrissgestaltung ist zeittypisch, aber funktional; die Räume sind gut belichtet.\n\nNebengebäude und Außenanlagen: Auf dem Grundstück steht eine massive Einzelgarage mit Schwingtor. Zufahrt und Terrasse sind mit Betonsteinpflaster befestigt. Der Garten ist gepflegt und mit Rasen, Sträuchern und Hecken angelegt. Zur Straße hin ist das Grundstück mit einem Mauersockel und einem Metallzaun eingefriedet.\n\nGesamteindruck: Das Gebäude befindet sich in einem baujahrstypischen, insgesamt durchschnittlichen Unterhaltungszustand.",

  "de": "3.2 Modernisierungen\n\nNach Angaben der Eigentümer und laut vorgelegten Rechnungen wurden seit dem Erwerb im Jahr 2005 folgende Modernisierungen durchgeführt:\n– 2006: Erneuerung der Elektroinstallation im Erd- und Dachgeschoss einschließlich Unterverteilung\n– 2009: Austausch aller Fenster gegen Kunststofffenster mit Zweifach-Wärmeschutzverglasung\n– 2012: Modernisierung des Badezimmers im Dachgeschoss mit bodengleicher Dusche\n– 2016: Erneuerung der Dacheindeckung einschließlich Dämmung zwischen den Sparren\n– 2021: Einbau eines Gas-Brennwertkessels; die Heizkörper wurden zum Teil erneuert\n\nDie Fassade und die Kelleraußenwände wurden bisher nicht gedämmt. Die Trinkwasserleitungen stammen überwiegend noch aus dem Baujahr. Nicht modernisiert wurde außerdem das Gäste-WC im Erdgeschoss.\n\nWürdigung: Unter Berücksichtigung der durchgeführten Maßnahmen ergeben sich nach dem Modell zur Ermittlung der Restnutzungsdauer bei Modernisierungen (Anlage 2 ImmoWertV) rund 8 Modernisierungspunkte. Das Gebäude weist damit einen mittleren Modernisierungsgrad auf. Bei einer Gesamtnutzungsdauer von 80 Jahren und einem Alter von 53 Jahren am Wertermittlungsstichtag wird eine modifizierte Restnutzungsdauer von rund 39 Jahren angesetzt. Ohne Modernisierungen hätte sie rechnerisch nur 27 Jahre betragen.\n\nHinweis: Die Angaben zu den Modernisierungen wurden bei der Ortsbesichtigung, soweit möglich, augenscheinlich überprüft. Eine Prüfung der Ausführungsqualität im Detail ist nicht erfolgt.",

  "de": "Im Exposé eines Maklers wird ein Einfamilienhaus in der Ahornstraße mit einer Wohnfläche von „ca. 165 m²“ angeboten. Im Gutachten ergibt sich dagegen eine Wohnfläche von 120 m². Wie ist dieser Unterschied zu erklären?\n\nErstens hat der Makler den Hobbyraum im Keller mit 22 m² mitgezählt. Nach der Wohnflächenverordnung (WoFlV) gehören Zubehörräume wie Kellerräume jedoch nicht zur Wohnfläche, und der Raum ist auch nicht als Aufenthaltsraum genehmigt. Zweitens wurden die Flächen im Dachgeschoss voll angesetzt. Nach der WoFlV werden Flächen mit einer lichten Höhe unter einem Meter gar nicht und Flächen zwischen einem und zwei Metern nur zur Hälfte angerechnet. Dadurch verringert sich die Fläche im Dachgeschoss um 11 m². Drittens hat der Makler die Terrasse mit 16 m² vollständig eingerechnet; im Gutachten wird sie, wie üblich, nur zu einem Viertel berücksichtigt, also mit 4 m².\n\nVon der Wohnfläche ist die Brutto-Grundfläche (BGF) zu unterscheiden. Sie wird für das Sachwertverfahren benötigt und aus den äußeren Maßen aller Geschosse einschließlich Keller ermittelt. Für dieses Haus beträgt sie rund 290 m².\n\nAuch beim Grundstück lohnt sich ein genauer Blick: Das Exposé nennt 580 m², laut Grundbuch und Liegenschaftskataster sind es 548 m². Maßgeblich ist die amtliche Fläche.\n\nDer Bodenrichtwert liegt in dieser Zone bei 310 Euro pro Quadratmeter für baureifes, erschließungsbeitragsfreies Land. Daraus ergibt sich ein vorläufiger Bodenwert von 548 mal 310 Euro, also 169.880 Euro oder rund 170.000 Euro.",

function icon(name, cls) { return h('span', { class: 'ic ' + (cls || ''), html: ICON[name] }); }

function speakBtn(textFn, label) {
  var b = h('button', { class: 'btn-icon', type: 'button', title: label || 'Anhören', 'aria-label': label || 'Anhören' }, icon('speak'));
  b.addEventListener('click', function () { TTS.speak(typeof textFn === 'function' ? textFn() : textFn); });
  if (!TTS.ok) b.hidden = true;
  return b;
}

function dictHint() {
  return h('p', { class: 'hint' }, icon('mic', 'sm'), ' Sprechen statt tippen: Mikrofon der Handy-Tastatur, am PC Windows + H (Mac: zweimal Fn).');
}

function answerBox(opts) {
  opts = opts || {};
  var ta = h('textarea', { class: 'answer', rows: opts.rows || 2, placeholder: opts.ph || 'Ihre Antwort …', autocapitalize: 'sentences', spellcheck: 'false', id: opts.id || ('a' + Math.random().toString(36).slice(2, 7)) });
  if (opts.value) ta.value = opts.value;
  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && opts.onEnter) { e.preventDefault(); opts.onEnter(); }
  });
  setTimeout(function () { if (opts.focus !== false) ta.focus(); }, 30);
  return ta;
}

/* Vorschau der Intervalle für die vier Bewertungsknöpfe */
function ivLabel(id, g) {
  var c = FSRS.review(JSON.parse(JSON.stringify(Cards.srs()[id] || {})), g);
  if (g === 1) return '10 Min';
  var days = Math.round((c.due - startOfDay()) / DAY);
  return days <= 1 ? '1 T' : days + ' T';
}
function gradeRow(id, onGrade, primary) {
  var names = ['', 'Nochmal', 'Schwer', 'Gut', 'Leicht'];
  var row = h('div', { class: 'grades' });
  [1, 2, 3, 4].forEach(function (g) {
    row.appendChild(h('button', {
      class: 'grade g' + g + (primary === g ? ' primary' : ''), type: 'button',
      onclick: function () { onGrade(g); }
    }, h('b', { text: names[g] }), h('small', { text: id ? ivLabel(id, g) : '' })));
  });
  return row;
}

function artClass(a) { return a === 'der' ? 'art-der' : a === 'die' ? 'art-die' : a === 'das' ? 'art-das' : ''; }
function wordHead(c) {
  return h('div', { class: 'word' },
    c.art ? h('span', { class: 'art ' + artClass(c.art), text: c.art }) : null,
    h('span', { class: 'de', text: c.de }),
    speakBtn((c.art ? c.art + ' ' : '') + c.de));
}

/* Vollständige Wortkarte (Einführung und Lösung) */
function wordCard(c) {
  var meta = [];
  if (c.pl !== undefined && c.art) meta.push(c.pl ? 'Pl. ' + c.pl : 'ohne Plural');
  if (c.forms) meta.push(c.forms);
  if (c.rek) meta.push(c.rek);
  return h('div', { class: 'wcard' },
    wordHead(c),
    meta.length ? h('p', { class: 'meta', text: meta.join(' · ') }) : null,
    h('p', { class: 'ru', text: c.ru }),
    c.ex ? h('div', { class: 'ex' }, h('p', { class: 'doc', text: c.ex }), speakBtn(c.ex, 'Beispiel anhören')) : null,
    c.exRu ? h('p', { class: 'ru small', text: c.exRu }) : null,
    c.col && c.col.length ? h('ul', { class: 'col' }, c.col.map(function (x) { return h('li', { text: x }); })) : null,
    c.note ? h('p', { class: 'note', text: c.note }) : null);
}

/* Verteiler für Wiederholungskarten.
   Liefert ein Element; ruft onGrade(g) einmal auf. */
function reviewCard(id, card, mode, onGrade0) {
  /* jede Karte wird genau einmal bewertet */
  var graded = false;
  var onGrade = function (g) { if (graded) return; graded = true; onGrade0(g); };
  var st = (Cards.srs()[id] || {}).st || 1;
  var reps = (Cards.srs()[id] || {}).reps || 0;
  var wrap = h('div', { class: 'rcard' });
  var isWord = card.type === 'vocab' || card.type === 'cust';
  var prompt, answers, solution, kindLabel;

  if (isWord && st <= 1) {
    var pool = distractors(card);
    if (pool.length >= 3) return mcCard(card, pool, onGrade);
  }
  if (isWord) {
    var useCloze = st >= 3 && card.cloze && card.ans && reps % 2 === 1;
    if (useCloze) {
      kindLabel = 'Lücke im Satz';
      prompt = h('div', {}, h('p', { class: 'doc big', html: esc(card.cloze).replace('___', '<span class="gap">___</span>') }), card.exRu ? h('p', { class: 'ru small', text: card.exRu }) : null);
      answers = [card.ans]; solution = function () { return wordCard(card); };
    } else {
      kindLabel = card.art ? 'Auf Deutsch, mit Artikel' : 'Auf Deutsch';
      prompt = h('p', { class: 'ru big', text: card.ru });
      answers = card.art ? [card.art + ' ' + card.de] : [card.de];
      solution = function () { return wordCard(card); };
    }
    var sayText = useCloze ? card.ex : Cards.label(card);
  } else if (card.type === 'fix') {
    kindLabel = 'Fehler finden und korrigieren';
    prompt = h('p', { class: 'doc big wrongline', text: card.wrong });
    answers = [card.right];
    solution = function () { return h('div', {}, h('p', { class: 'doc big', text: card.right }), card.why ? h('p', { class: 'ru small', text: card.why }) : null); };
    sayText = card.right;
  } else if (card.type === 'task') {
    kindLabel = card.i || 'Aufgabe';
    prompt = h('p', { class: (card.t === 'translate' ? 'ru' : 'doc') + ' big', text: card.q });
    answers = card.a; sayText = card.a[0];
    solution = function () { return h('p', { class: 'doc big', text: card.a[0] }); };
  } else {
    kindLabel = card.unit ? 'Sprechen: ' + card.unit : 'Sagen Sie es auf Deutsch';
    prompt = h('p', { class: 'ru big', text: card.ru });
    answers = [card.de]; sayText = card.de;
    solution = function () { return h('p', { class: 'doc big', text: card.de }); };
  }

  wrap.appendChild(h('p', { class: 'eyebrow', text: kindLabel }));
  wrap.appendChild(prompt);
  var res = h('div', { class: 'result' });

  if (mode === 'speak') {
    var showBtn = h('button', { class: 'btn primary', type: 'button', text: 'Laut gesagt – Lösung zeigen' });
    showBtn.addEventListener('click', function () {
      showBtn.remove();
      res.appendChild(solution());
      if (Store.get('settings').autoTts !== false) TTS.speak(sayText);
      var row = gradeRow(id, onGrade, 3);
      res.appendChild(row);
      row.querySelector('.primary').focus();
    });
    wrap.appendChild(h('p', { class: 'hint', text: 'Sprechen Sie die Antwort laut aus, dann aufdecken und ehrlich bewerten.' }));
    wrap.appendChild(showBtn);
  } else {
    var checked = false;
    var ta = answerBox({ rows: card.type === 'vocab' ? 1 : 2, value: card.type === 'fix' ? card.wrong : '', onEnter: function () { chk.click(); } });
    var chk = h('button', { class: 'btn primary', type: 'button', text: 'Prüfen' });
    chk.addEventListener('click', function () {
      if (checked) return; checked = true;
      var r = checkAnswer(ta.value, answers);
      chk.remove(); ta.readOnly = true;
      res.appendChild(verdict(r, ta.value));
      res.appendChild(solution());
      if (Store.get('settings').autoTts !== false) TTS.speak(sayText);
      var prim = r.res === 'ok' ? 3 : r.res === 'near' ? 2 : 1;
      var row = gradeRow(id, onGrade, prim);
      res.appendChild(row);
      if (r.res === 'wrong' && !isWord && AI.ready()) res.appendChild(aiCheckBtn(kindLabel + ': ' + (card.ru || card.wrong || card.q), answers, ta.value, function (ok) { if (ok && wrap.isConnected) onGrade(3); }));
      row.querySelector('.primary').focus();
    });
    wrap.appendChild(ta);
    wrap.appendChild(dictHint());
    wrap.appendChild(chk);
  }
  wrap.appendChild(res);
  return wrap;
}

function modeSwitch(onChange) {

function reviewRunner(el, done, run) {
  var ids = Cards.due().slice(0, 200);

  el.appendChild(stage);
  stage.appendChild(h('p', { class: 'muted', text: 'Karten werden geladen …' }));

  var need = Cards.needDays(ids);
  Promise.all(need.map(function (d) { return Content.loadGen(d); })).then(function () {

  function empty() {
    stage.textContent = '';
    var all = Object.keys(Cards.srs());
    stage.appendChild(h('div', { class: 'empty' },
      h('p', { class: 'big', text: all.length ? 'Alles wiederholt. Keine Karte ist fällig.' : 'Noch keine Karten. Sie entstehen im Block „Neue Wörter“.' }),
      all.length ? h('button', {

          var c = Cards.srs();
          ids = all.filter(function (id) { return Cards.get(id); }).sort(function (a, b) { return (c[a].s || 0) - (c[b].s || 0); }).slice(0, 20);

  function next() {

      counter.textContent = '';

Runners.new = function (ctx) {
  var srs = Cards.srs();
  var items = ctx.b.vocab.filter(function (v) { return !srs[v.id]; });
  var cust = Store.get('custom'); cust.queue = cust.queue || [];
  var extra = cust.queue.slice(0, 8).map(function (id) { return Cards.get(id); }).filter(Boolean);
  items = items.concat(extra);
  var el = ctx.el;
  if (!items.length) {
    el.appendChild(h('div', { class: 'empty' }, h('p', { class: 'big', text: 'Die Wörter dieses Tages sind schon in Ihren Karten.' }), h('button', { class: 'btn primary', type: 'button', text: 'Weiter', onclick: ctx.done })));
    return;
  }
  var batches = [];
  for (var i = 0; i < items.length; i += 6) batches.push(items.slice(i, i + 6));
  var bi = 0, stage = h('div', { class: 'stage' }), counter = h('p', { class: 'counter' });
  el.appendChild(h('div', { class: 'toolbar' }, counter));
  el.appendChild(stage);
  intro(0);

  function intro(k) {
    var batch = batches[bi];
    counter.textContent = 'Gruppe ' + (bi + 1) + ' von ' + batches.length + ' · Wort ' + (k + 1) + ' von ' + batch.length;
    stage.textContent = '';
    var c = batch[k];
    stage.appendChild(h('p', { class: 'hint', text: 'Hören, laut nachsprechen, das Beispiel einmal laut lesen.' }));
    stage.appendChild(wordCard(c));
    if (Store.get('settings').autoTts !== false) setTimeout(function () { TTS.speak(Cards.label(c)); }, 120);
    stage.appendChild(h('div', { class: 'row' },
      k > 0 ? h('button', { class: 'btn ghost', type: 'button', text: 'Zurück', onclick: function () { intro(k - 1); } }) : null,
      h('button', { class: 'btn primary', type: 'button', text: k < batch.length - 1 ? 'Nächstes Wort' : 'Jetzt abfragen', onclick: function () { if (k < batch.length - 1) intro(k + 1); else quiz(shuffle(batch), 0); } })));
  }
  function quiz(list, k) {
    if (k >= list.length) {
      bi++;
      if (bi < batches.length) return intro(0);
      stage.textContent = '';
      stage.appendChild(h('div', { class: 'empty' }, h('p', { class: 'big', text: items.length + ' neue Karten aufgenommen. Morgen kommen sie in der Wiederholung.' }), h('button', { class: 'btn primary', type: 'button', text: 'Weiter', onclick: ctx.done })));

    wrap.appendChild(h('p', { class: 'eyebrow', text: c.art ? 'Auf Deutsch, mit Artikel' : 'Auf Deutsch' }));
    wrap.appendChild(h('p', { class: 'ru big', text: c.ru }));
    var res = h('div', { class: 'result' });
    var show = h('button', { class: 'btn primary', type: 'button', text: 'Laut gesagt – Lösung zeigen' });
    show.addEventListener('click', function () {
      show.remove();
      res.appendChild(wordHead(c));
      TTS.speak(Cards.label(c));
      res.appendChild(gradeRow(null, function (g) {
        Cards.learn(c.id, g);
        var cq = Store.get('custom'); cq.queue = cq.queue || [];
        var q = cq.queue.indexOf(c.id);
        if (q >= 0) { cq.queue.splice(q, 1); Store.save('custom'); }
        if (ctx.run) ctx.run.stat(g >= 3);
        quiz(list, k + 1);

Runners.mix = function (ctx) {

function drillTask(x) {
  var lab = { gap: 'Lücke füllen', choice: 'Richtige Form wählen', transform: x.i || 'Umformen', order: 'Satz bauen', translate: 'Übersetzen', fix: 'Fehler korrigieren' }[x.t] || 'Aufgabe';
  return lab + ': ' + x.q;
}

function drillRunner(ctx, u, list, opt) {
  var el = ctx.el, stage = h('div', { class: 'stage' }), counter = h('p', { class: 'counter' });
  var right = 0, total = 0, tagStats = {}, retried = {};
  el.appendChild(h('div', { class: 'toolbar' }, counter));
  if (opt.rule && u.rule) {
    var det = h('details', { class: 'rule' }, h('summary', {}, h('b', { text: u.de }), h('span', { class: 'ru small', text: ' · ' + (u.ru || '') })),
      h('div', { class: 'rulebody', html: u.rule }),
      u.examples && u.examples.length ? h('ul', { class: 'examples' }, u.examples.map(function (e) { return h('li', {}, h('p', { class: 'doc', text: e.de }), h('p', { class: 'ru small', text: e.ru }), speakBtn(e.de)); })) : null);
    var seen = Store.get('prog').seenRule || {};
    if (!seen[u.id]) det.open = true;
    det.addEventListener('toggle', function () { var p = Store.get('prog'); p.seenRule = p.seenRule || {}; p.seenRule[u.id] = 1; Store.save('prog'); });
    el.appendChild(det);
  }
  if (opt.intro) el.appendChild(h('div', { class: 'rulebody', html: opt.intro }));
  el.appendChild(stage);
  var queue = list.slice(), i = 0;
  next();

  function next() {
    if (!queue.length) return finish();
    var x = queue.shift();
    i++;
    counter.textContent = 'Übung ' + i + ' · noch ' + queue.length + (total ? ' · ' + Math.round(100 * right / total) + ' % richtig' : '');
    stage.textContent = '';
    stage.appendChild(renderDrill(x, function (ok, user) {
      total++; if (ok) right++;
      if (ctx.run) ctx.run.stat(ok);
      if (opt.diag && x.tag) { tagStats[x.tag] = tagStats[x.tag] || [0, 0]; tagStats[x.tag][1]++; if (ok) tagStats[x.tag][0]++; }
      var uid = x._u || u.id;
      var p = Store.get('prog'); p.g = p.g || {}; p.g[uid] = p.g[uid] || [0, 0]; p.g[uid][1]++; if (ok) p.g[uid][0]++; Store.save('prog');
      if (!ok) {
        if (ctx.run) ctx.run.miss({ t: x.t, i: drillTask(x).split(': ')[0], q: x.q, a: x.a, user: user, cat: catOf(uid) });
        var key = x.q;
        if (!retried[key] && !opt.diag) { retried[key] = 1; queue.splice(Math.min(3, queue.length), 0, x); }
        /* Claude hat eine abweichende Lösung als richtig bestätigt: Wertung zurücknehmen */
        return function undo() {
          right++;
          var pp = Store.get('prog'); if (pp.g && pp.g[uid]) { pp.g[uid][0]++; Store.save('prog'); }
          if (ctx.run && ctx.run.unmiss) ctx.run.unmiss(x.q);
          var qi = queue.indexOf(x); if (qi >= 0) queue.splice(qi, 1);
        };
      }
    }, next));
  }
  function finish() {
    stage.textContent = '';
    var box = h('div', { class: 'empty' }, h('p', { class: 'big', text: right + ' von ' + total + ' richtig' }));
    if (opt.diag) {
      var p = Store.get('prog'); p.diag = tagStats; Store.save('prog');
      box.appendChild(diagTable(tagStats));
    }
    if (!opt.diag && AI.ready() && u.drills && u.drills.length) {
      var more = h('button', { class: 'btn', type: 'button', text: '8 weitere Übungen von Claude' });
      more.addEventListener('click', function () {
        more.disabled = true; more.textContent = 'Claude erstellt Übungen …';
        AI.json(Prompts.moreDrills(u, 8), { modelTier: 'default', cache: false }).then(function (arr) {
          arr = (Array.isArray(arr) ? arr : []).filter(function (x) { return x && x.t && x.q && Array.isArray(x.a) && x.a.length; });
          if (!arr.length) throw { code: 'invalid_json' };
          queue = arr; next();
        }).catch(function (e) { more.disabled = false; more.textContent = '8 weitere Übungen von Claude'; var m = AI.msg(e); if (m) toast(m); });
      });
      box.appendChild(more);
    }
    box.appendChild(h('button', { class: 'btn primary', type: 'button', text: 'Weiter', onclick: ctx.done }));
    stage.appendChild(box);
  }
}

function catOf(uid) {
  return { 'g-tempus': 'tempus', 'g-kausal': 'verbstellung', 'g-nebensatz': 'verbstellung', 'g-praep': 'praep', 'g-adj': 'adj', 'g-relativ': 'kasus', 'g-passiv': 'tempus', 'g-zustand': 'tempus', 'g-gegensatz': 'verbstellung', 'g-zahlen': 'andere', 'g-konj2': 'konj' }[uid] || 'andere';

var TAGS = { tempus: 'Zeitformen', adj: 'Adjektivendungen', kasus: 'Kasus', praep: 'Präpositionen', nebensatz: 'Nebensätze', passiv: 'Passiv', konj2: 'Konjunktiv II', relativ: 'Relativsätze', rektion: 'Rektion', zahlen: 'Zahlen', wortstellung: 'Wortstellung', ndekl: 'N-Deklination' };

  return h('table', { class: 'tbl' }, h('tr', {}, h('th', { text: 'Thema' }), h('th', { text: 'Richtig' })),
    rows.map(function (k) { var r = st[k]; return h('tr', { class: r[0] < r[1] ? 'weak' : '' }, h('td', { text: TAGS[k] || k }), h('td', { text: r[0] + ' / ' + r[1] })); }));
}

/* Eine Übung darstellen. report(ok, user) einmal; next() zum Weitergehen */
function renderDrill(x, report, next) {
  var wrap = h('div', { class: 'rcard drill' });
  var lab = drillTask(x).split(': ')[0];
  wrap.appendChild(h('p', { class: 'eyebrow', text: lab + (x._ude ? ' · ' + x._ude : '') }));
  var res = h('div', { class: 'result' });
  var reported = false, undo = null;
  function done(ok, user, r) {
    if (reported) return; reported = true;
    undo = report(ok, user);
    if (r) res.appendChild(verdict(r, user));
    if (x.t === 'translate' || x.t === 'transform' || x.t === 'fix') res.appendChild(h('p', { class: 'doc', text: x.a[0] }));
    var full = (x.t === 'gap' || x.t === 'choice' ? x.q.replace('___', x.a[0]) : x.a[0]).replace(/\s*\([^)]*\)/g, '');
    if (Store.get('settings').autoTts !== false) TTS.speak(full);
    if (x.h && !ok) res.appendChild(h('p', { class: 'ru small', text: x.h }));
    var row = h('div', { class: 'row' }, speakBtn(full));
    if (!ok && AI.ready()) {
      var ex = h('button', { class: 'btn ghost', type: 'button', text: 'Erklären (Claude)' });
      ex.addEventListener('click', function () {
        ex.disabled = true; ex.textContent = 'Claude erklärt …';
        AI.text(Prompts.explainDrill(drillTask(x), x.a[0], user), { modelTier: 'quick' }).then(function (t) { ex.replaceWith(h('p', { class: 'ru small expl', text: t })); })
          .catch(function (e) { ex.disabled = false; ex.textContent = 'Erklären (Claude)'; var m = AI.msg(e); if (m) toast(m); });
      });
      row.appendChild(ex);
    }
    var nb = h('button', { class: 'btn primary', type: 'button', text: 'Weiter', onclick: next });
    row.appendChild(nb);
    res.appendChild(row);
    if (!ok && (x.t === 'translate' || x.t === 'transform') && AI.ready() && user) res.appendChild(aiCheckBtn(drillTask(x), x.a, user, function (good) { if (good && undo) { undo(); undo = null; toast('Als richtig gewertet'); } }));
    setTimeout(function () { nb.focus(); }, 50);
  }

  if (x.t === 'choice') {
    wrap.appendChild(h('p', { class: 'doc big', html: esc(x.q).replace('___', '<span class="gap">___</span>') }));
    var ch = h('div', { class: 'choices' });
    shuffle(x.o).forEach(function (o) {
      var b = h('button', { class: 'choice', type: 'button', text: o });
      b.addEventListener('click', function () {
        var ok = x.a.indexOf(o) >= 0;
        Array.prototype.forEach.call(ch.children, function (c) { c.disabled = true; if (x.a.indexOf(c.textContent) >= 0) c.classList.add('right'); });
        if (!ok) b.classList.add('wrong');
        done(ok, o, ok ? { res: 'ok', best: o } : { res: 'wrong', best: x.a[0] });
      });
      ch.appendChild(b);
    });
    wrap.appendChild(ch);
  } else if (x.t === 'order') {
    var chunks = shuffle(x.q.split(/\s*\/\s*/)), built = [];
    var line = h('div', { class: 'built', 'aria-live': 'polite' }), pool = h('div', { class: 'chips' });
    function draw() {
      line.textContent = ''; pool.textContent = '';
      built.forEach(function (c, k) { line.appendChild(h('button', { class: 'chip on', type: 'button', text: c, onclick: function () { if (!reported) { built.splice(k, 1); draw(); } } })); });
      var left = chunks.slice(); built.forEach(function (c) { left.splice(left.indexOf(c), 1); });
      left.forEach(function (c) { pool.appendChild(h('button', { class: 'chip', type: 'button', text: c, onclick: function () { if (!reported) { built.push(c); draw(); } } })); });
    }
    draw();
    wrap.appendChild(line); wrap.appendChild(pool);
    var ck = h('button', { class: 'btn primary', type: 'button', text: 'Prüfen' });
    ck.addEventListener('click', function () {
      var user = built.join(' '); var r = checkAnswer(user, x.a);
      ck.remove(); done(r.res !== 'wrong', user, r);
    });
    wrap.appendChild(ck);
  } else {
    var qText = x.t === 'gap' ? h('p', { class: 'doc big', html: esc(x.q).replace('___', '<span class="gap">___</span>') })
      : h('p', { class: (x.t === 'translate' ? 'ru' : 'doc') + ' big', text: x.q });
    if (x.t === 'transform' && x.i) wrap.appendChild(h('p', { class: 'instr', text: x.i }));
    wrap.appendChild(qText);
    var ta = answerBox({ rows: x.t === 'gap' ? 1 : 2, value: x.t === 'fix' ? x.q : '', ph: x.t === 'gap' ? 'Lücke …' : 'Ihre Antwort …', onEnter: function () { ck2.click(); } });
    var ck2 = h('button', { class: 'btn primary', type: 'button', text: 'Prüfen' });
    ck2.addEventListener('click', function () {
      var user = ta.value.trim();
      var r = checkAnswer(user, x.a);
      if (x.t === 'fix' && normA(user) === normA(x.q)) r = { res: 'wrong', best: x.a[0] };
      ck2.remove(); ta.readOnly = true;
      done(r.res !== 'wrong', user, r);
    });
    var skip = h('button', { class: 'btn ghost', type: 'button', text: 'Weiß ich nicht', onclick: function () { ta.readOnly = true; ck2.remove(); skip.remove(); done(false, '', { res: 'wrong', best: x.a[0] }); } });
    wrap.appendChild(ta);
    if (x.t !== 'gap') wrap.appendChild(dictHint());
    wrap.appendChild(h('div', { class: 'row' }, skip, ck2));
  }
  wrap.appendChild(res);
  return wrap;
}

/* ---------- 4. Hören und Lesen ---------- */
Runners.text = function (ctx) {
  var t = ctx.b.text, el = ctx.el;
  if (!t) { el.appendChild(h('div', { class: 'empty' }, h('p', { text: 'Kein Text für heute.' }), h('button', { class: 'btn primary', type: 'button', text: 'Weiter', onclick: ctx.done }))); return; }
  var steps = ['Hören', 'Fragen', 'Lesen', 'Nacherzählen'], si = 0;
  var tabs = h('div', { class: 'steps' }), stage = h('div', { class: 'stage' });
  el.appendChild(h('p', { class: 'eyebrow', text: t.kind || 'Text' }));
  el.appendChild(h('h3', { class: 'doc-title', text: t.title }));
  el.appendChild(tabs); el.appendChild(stage);
  var rate = 0.9;
  function drawTabs() {
    tabs.textContent = '';
    steps.forEach(function (s, k) { tabs.appendChild(h('button', { type: 'button', class: k === si ? 'on' : '', text: (k + 1) + '. ' + s, onclick: function () { si = k; go(); } })); });
  }
  function player() {
    var playing = false;
    var b = h('button', { class: 'btn primary', type: 'button' }, icon('speak', 'sm'), ' Text anhören');
    b.addEventListener('click', function () {
      if (playing) { TTS.stop(); playing = false; b.lastChild.textContent = ' Text anhören'; return; }
      playing = true; b.lastChild.textContent = ' Stopp';

    });

    sel.addEventListener('change', function () { rate = +sel.value; });
    return h('div', { class: 'row' }, b, h('label', { class: 'inline', for: 'rate-sel' }, 'Tempo ', sel));
  }
  function go() {
    drawTabs(); stage.textContent = ''; TTS.stop();
    if (si === 0) {
      stage.appendChild(h('p', { class: 'hint', text: 'Zuerst nur hören, ohne Text. Worum geht es? Wer, was, wo, welche Zahlen?' }));
      if (!TTS.ok) stage.appendChild(h('p', { class: 'note', text: 'Dieser Browser kann nicht vorlesen. Lesen Sie den Text einmal schnell und gehen Sie zu den Fragen.' }));
      stage.appendChild(player());
      stage.appendChild(h('button', { class: 'btn', type: 'button', text: 'Weiter zu den Fragen', onclick: function () { si = 1; go(); } }));
    } else if (si === 1) {
      var ok = 0, n = 0;
      (t.q || []).forEach(function (q, qi) {
        var box = h('div', { class: 'mcq' }, h('p', { class: 'doc', text: (qi + 1) + '. ' + q.q }));
        var ch = h('div', { class: 'choices' });
        q.o.forEach(function (o, k) {
          var b = h('button', { class: 'choice', type: 'button', text: o });
          b.addEventListener('click', function () {
            Array.prototype.forEach.call(ch.children, function (c, j) { c.disabled = true; if (j === q.a) c.classList.add('right'); });
            n++; if (k === q.a) ok++; else b.classList.add('wrong');
            box.appendChild(h('p', { class: 'verdict ' + (k === q.a ? 'ok' : 'wrong'), role: 'status', text: k === q.a ? 'Richtig' : 'Falsch. Richtig ist: ' + q.o[q.a] }));
            if (ctx.run) ctx.run.stat(k === q.a);

      if (t.ru) stage.appendChild(h('p', { class: 'ru small', text: t.ru }));
      if (t.gl && t.gl.length) stage.appendChild(h('dl', { class: 'gloss' }, t.gl.map(function (g) { return [h('dt', { text: g.de }), h('dd', { text: g.ru })]; })));

Runners.drill = function (ctx) {
  var b = ctx.b, items = [];
  if (b.grammar && b.grammar.speak) items = b.grammar.speak.map(function (s, i) { return { id: b.grammar.id + '#' + i, ru: s.ru, de: s.de }; });

  items = items.slice(0, 18);
  var el = ctx.el, stage = h('div', { class: 'stage' }), counter = h('p', { class: 'counter' }), hard = [], k = 0, t0 = 0;
  el.appendChild(h('div', { class: 'toolbar' }, counter));

  el.appendChild(stage);
  var list = items.slice();
  show();
  function show() {
    if (k >= list.length) {

      else {
        stage.textContent = '';
        stage.appendChild(h('div', { class: 'empty' }, h('p', { class: 'big', text: 'Sprech-Drill geschafft.' }), h('button', { class: 'btn primary', type: 'button', text: 'Weiter', onclick: ctx.done })));
        counter.textContent = '';

    stage.textContent = '';

    var showBtn = h('button', { class: 'btn primary', type: 'button', text: 'Lösung zeigen' });

      var sec = Math.round((Date.now() - t0) / 1000);

      res.appendChild(h('div', { class: 'row' }, speakBtn(it.de)));

Views.sitzung = function (el, opts) {
  var d = opts.day, s = opts.s, b = opts.bundle;
  var blocks = sessionsFor(b.type)[s];
  /* immer frisch aus dem Speicher holen: ein Abgleich mit dem anderen Gerät kann das Objekt ersetzen */
  function dayProg() {
    var prog = Store.get('prog'); prog.days = prog.days || {};
    var x = prog.days[d] = prog.days[d] || {}; x[s] = x[s] || { b: {} }; x[s].b = x[s].b || {};
    return x;
  }
  var dp = dayProg();
  var idx = 0;
  while (idx < blocks.length - 1 && dp[s].b[blocks[idx][0]]) idx++;
  if (dp[s].done) idx = opts.idx || 0;
  Wake.on();
  var top = h('div', { class: 'runhead' });
  var timer = h('span', { class: 'clock', role: 'timer', 'aria-label': 'Lernzeit in diesem Block' });
  var holder = h('div', { class: 'block' });
  el.appendChild(top); el.appendChild(holder);

  var run = {
    stat: function () { },

      var p = Store.get('prog'); p.misses = p.misses || [];
      m.day = d; m.at = Date.now(); p.misses.push(m); p.misses = p.misses.slice(-80);
      Store.save('prog');

    unmiss: function (q) {
      var p = Store.get('prog'), l = p.misses || [];

    }
  };
  function draw() {
    top.textContent = '';
    var cur = blocks[idx];
    dp = dayProg();
    top.appendChild(h('div', { class: 'runbar' },
      h('button', { class: 'btn-icon', type: 'button', 'aria-label': 'Zurück zu Heute', onclick: function () { Wake.off(); App.go('heute', { day: d }); } }, icon('back')),
      h('span', { class: 'runtitle', text: 'Tag ' + d + ' · Sitzung ' + (s === 's1' ? 1 : 2) }),

      return h('li', { class: (k === idx ? 'cur ' : '') + (dp[s].b[x[0]] ? 'ok' : '') },
        h('button', { type: 'button', title: BLOCKS[x[0]].de, 'aria-label': (k + 1) + '. ' + BLOCKS[x[0]].de, onclick: function () { idx = k; start(); } }, String(k + 1)));
    })));
    top.appendChild(h('div', { class: 'blockhead' },
      h('h2', {}, h('span', { class: 'num', text: (idx + 1) + '.' }), ' ' + BLOCKS[cur[0]].de),
      h('p', { class: 'ru small', text: BLOCKS[cur[0]].ru })));
  }
  function start() {
    TTS.stop(); Chat.stop();
    draw();
    holder.textContent = '';
    var cur = blocks[idx];
    Clock.start(timer, cur[1]);
    var inner = h('div', {});

function minutesChart(min) {
  var W = 340, H = 140, pad = 24, n = 14, bw = (W - pad - 6) / n;
  var vals = []; for (var i = n - 1; i >= 0; i--) { var k = dayKey(Date.now() - i * DAY); vals.push({ k: k, v: min[k] || 0 }); }
  var max = Math.max(90, Math.max.apply(null, vals.map(function (x) { return x.v; })));
  var y = function (v) { return H - 18 - (v / max) * (H - 30); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img" aria-label="Lernminuten pro Tag">';
  s += '<line x1="' + pad + '" x2="' + W + '" y1="' + y(90) + '" y2="' + y(90) + '" class="goal"/><text x="0" y="' + (y(90) + 4) + '" class="axis">90</text>';
  vals.forEach(function (x, i) {
    var hgt = Math.max(0, H - 18 - y(x.v));
    s += '<rect x="' + (pad + i * bw + 2) + '" y="' + y(x.v) + '" width="' + (bw - 4) + '" height="' + hgt + '" rx="2" class="' + (x.v >= 90 ? 'cbarok' : 'cbar') + '"><title>' + x.k + ': ' + Math.round(x.v) + ' Min</title></rect>';
    if (i % 2 === 1 || i === n - 1) s += '<text x="' + (pad + i * bw + bw / 2) + '" y="' + (H - 4) + '" class="axis" text-anchor="middle">' + x.k.slice(8) + '.</text>';
  });
  return h('div', { class: 'chartbox', html: s + '</svg>' });
}
function scoreChart(list) {
  var W = 340, H = 120, n = list.length, keys = ['grammatik', 'wortschatz', 'fachsprache', 'ausdruck'];
  var x = function (i) { return 20 + (n === 1 ? 0 : i * (W - 30) / (n - 1)); }, y = function (v) { return H - 14 - (v - 1) / 4 * (H - 28); };
  var avg = list.map(function (c) { var s = 0, k = 0; keys.forEach(function (q) { if (c.scores[q]) { s += +c.scores[q]; k++; } }); return k ? s / k : 0; });
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img" aria-label="Durchschnittliche Gesprächsbewertung">';
  [1, 3, 5].forEach(function (v) { s += '<line x1="20" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '" class="grid"/><text x="2" y="' + (y(v) + 4) + '" class="axis">' + v + '</text>'; });
  s += '<polyline fill="none" class="line" points="' + avg.map(function (v, i) { return x(i) + ',' + y(v); }).join(' ') + '"/>';
  avg.forEach(function (v, i) { s += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="' + (i === n - 1 ? 4 : 2.5) + '" class="dot"><title>' + list[i].sc + ': ' + v.toFixed(1) + '</title></circle>'; });
  return h('div', { class: 'chartbox', html: s + '</svg>' });
}

/* ---------- Mehr ---------- */
Views.mehr = function (el) {
  el.appendChild(h('h1', { class: 'viewtitle', text: 'Mehr' }));
  var prof = Store.get('profile'), set = Store.get('settings');

  /* Selbstpräsentation */
  var pitchBox = h('section', { class: 'panel' }, h('h2', { class: 'sub', text: 'Meine Selbstpräsentation' }),
    h('p', { class: 'ru small', text: 'Самопрезентация для собеседования (~2 минуты). Слушайте, повторяйте за диктором, улучшайте вместе с Claude.' }));
  var pta = h('textarea', { id: 'pitch', rows: 9, class: 'answer doc' }); pta.value = prof.draft || prof.pitch || '';
  pta.addEventListener('input', function () { Store.get('profile').draft = pta.value; });
  pitchBox.appendChild(pta);
  var prow = h('div', { class: 'row' },
    h('button', { class: 'btn', type: 'button', text: 'Speichern', onclick: function () { var pr = Store.get('profile'); pr.pitch = pta.value.trim(); delete pr.draft; Store.save('profile'); toast('Gespeichert'); } }),
    speakBtn(function () { return pta.value; }, 'Selbstpräsentation anhören'));
  if (AI.ready()) prow.appendChild(h('button', {
    class: 'btn ghost', type: 'button', text: 'Mit Claude verbessern', onclick: function (ev) {
      if (pta.value.trim().length < 50) { toast('Bitte zuerst einen Text eingeben.'); return; }
      var b = ev.target; b.disabled = true; b.textContent = 'Claude überarbeitet …';
      AI.text(Prompts.improvePitch(pta.value), { modelTier: 'default', cache: false }).then(function (t) {
        b.disabled = false; b.textContent = 'Mit Claude verbessern';
        pitchBox.appendChild(h('div', { class: 'model' }, h('p', { class: 'eyebrow', text: 'Vorschlag von Claude' }), h('p', { class: 'doc', text: t }), h('div', { class: 'row' }, speakBtn(t), h('button', { class: 'btn', type: 'button', text: 'Übernehmen', onclick: function () { pta.value = t; var pr = Store.get('profile'); pr.pitch = t; delete pr.draft; Store.save('profile'); toast('Übernommen'); } }))));
      }).catch(function (e) { b.disabled = false; b.textContent = 'Mit Claude verbessern'; var m = AI.msg(e); if (m) toast(m); });
    }
  }));
  pitchBox.appendChild(prow);
  pitchBox.appendChild(h('button', { class: 'btn ghost', type: 'button', text: 'Satz für Satz nachsprechen', onclick: function (ev) { ev.target.replaceWith(shadowing((pta.value.match(/[^.!?]+[.!?]/g) || []).map(function (s) { return s.trim(); }), null)); } }));
  el.appendChild(pitchBox);

  /* Ordner fotografieren */
  var binder = h('section', { class: 'panel' }, h('h2', { class: 'sub', text: 'Seite aus dem Ordner → Karten' }),
    h('p', { class: 'ru small', text: 'Сфотографируйте страницу из папки с материалами — Claude выберет термины, и они войдут в блок «Новые слова».' }));
  var file = h('input', { type: 'file', id: 'binder-file', accept: 'image/jpeg,image/png,image/webp' });
  var out = h('div', {});
  file.addEventListener('change', function () {
    var f = file.files && file.files[0]; if (!f) return;
    file.value = '';
    out.textContent = ''; out.appendChild(h('p', { class: 'muted', text: 'Claude liest die Seite …' }));
    AI.fn.json(Prompts.binder(), { images: [f], modelTier: 'default', cache: false }).then(function (arr) {
      arr = (Array.isArray(arr) ? arr : []).filter(function (x) { return x && x.de && x.ru; });
      out.textContent = '';
      if (!arr.length) return out.appendChild(h('p', { text: 'Keine Begriffe erkannt. Bitte ein schärferes Foto versuchen.' }));
      var pl = pickList(arr, function (x) { return [h('p', { class: 'doc' }, x.art ? h('span', { class: 'art ' + artClass(x.art), text: x.art + ' ' }) : null, x.de), h('p', { class: 'ru small', text: x.ru })]; });
      out.appendChild(pl.el);
      out.appendChild(h('button', {
        class: 'btn primary', type: 'button', text: 'In „Neue Wörter“ aufnehmen', onclick: function (ev) {
          var cu = Store.get('custom'); cu.items = cu.items || {}; cu.queue = cu.queue || [];
          pl.picked().forEach(function (x) {
            var id = 'c-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
            cu.items[id] = { type: 'cust', kind: x.art ? 'noun' : 'chunk', de: x.de, art: x.art || '', pl: x.pl || '', ru: x.ru, ex: x.ex || '', exRu: x.exRu || '' };
            cu.queue.push(id);
          });
          Store.save('custom'); ev.target.disabled = true; ev.target.textContent = 'Aufgenommen';
        }
      }));
    }).catch(function (e) { out.textContent = ''; out.appendChild(h('p', { text: e && e.code === 'images_unavailable' ? 'Bilder sind in dieser Ansicht nicht verfügbar.' : (AI.msg(e) || 'Abgebrochen.') })); });
  });
  var pick = h('label', { class: 'btn', for: 'binder-file', hidden: true }, 'Foto aufnehmen oder wählen', file);
  var noImg = h('p', { class: 'note', text: AI.ready() ? 'Prüfe, ob Fotos an Claude gesendet werden können …' : 'Dafür braucht die App Claude.' });
  binder.appendChild(pick); binder.appendChild(noImg);
  if (AI.ready() && AI.fn.limits) AI.fn.limits().then(function (l) {
    if (l && l.images) { pick.hidden = false; noImg.remove(); } else noImg.textContent = 'Fotos können in dieser Ansicht nicht an Claude gesendet werden.';
  }).catch(function () { noImg.textContent = 'Fotos können in dieser Ansicht nicht an Claude gesendet werden.'; });
  binder.appendChild(out);
  el.appendChild(binder);

  /* Fehlerliste */
  var errs = (Store.get('errs').list || []).slice(-30).reverse();
  if (errs.length) el.appendChild(h('section', { class: 'panel' }, h('h2', { class: 'sub', text: 'Letzte Fehler' }),
    h('ul', { class: 'errlist' }, errs.map(function (e) { return h('li', {}, h('p', { class: 'doc wrongline', text: e.wrong }), h('p', { class: 'doc', text: e.right }), e.why ? h('p', { class: 'ru small', text: e.why }) : null); }))));

  /* Einstellungen */
  var sp = h('section', { class: 'panel' }, h('h2', { class: 'sub', text: 'Einstellungen' }));
  var vsel = h('select', { id: 'voice' }, h('option', { value: '', text: 'automatisch' }));
  TTS.voices.forEach(function (v) { var o = h('option', { value: v.voiceURI, text: v.name + ' (' + v.lang + ')' }); if (set.voice === v.voiceURI) o.selected = true; vsel.appendChild(o); });
  vsel.addEventListener('change', function () { set.voice = vsel.value; Store.save('settings'); TTS.speak('Guten Tag, ich bin Ihre Stimme für den Kurs.'); });
  var rate = h('input', { type: 'range', id: 'rate', min: '0.7', max: '1.2', step: '0.05', value: String(set.rate || 0.95) });
  var rateV = h('span', { class: 'muted', text: String(set.rate || 0.95) });
  rate.addEventListener('change', function () { set.rate = +rate.value; rateV.textContent = rate.value; Store.save('settings'); TTS.speak('So klingt das neue Tempo.'); });
  var tier = h('select', { id: 'tier' }, h('option', { value: 'quick', text: 'schnell (kurze Wartezeit)' }), h('option', { value: 'default', text: 'gründlich (bessere Antworten, langsamer)' }));
  tier.value = set.chatTier || 'quick';
  tier.addEventListener('change', function () { set.chatTier = tier.value; Store.save('settings'); });
  var auto = h('input', { type: 'checkbox', id: 'autotts' }); auto.checked = set.autoTts !== false;
  auto.addEventListener('change', function () { set.autoTts = auto.checked; Store.save('settings'); });
  var name = h('input', { type: 'text', id: 'pname', value: prof.name || '' });
  name.addEventListener('change', function () { prof.name = name.value.trim(); Store.save('profile'); });
  sp.appendChild(h('div', { class: 'form' },
    h('label', { for: 'pname' }, 'Name'), name,
    h('label', { for: 'voice' }, 'Stimme'), TTS.voices.length ? vsel : h('p', { class: 'muted small', text: 'Keine deutsche Stimme gefunden. Auf Android: Einstellungen → Sprachausgabe → Google, Deutsch installieren.' }),
    h('label', { for: 'rate' }, 'Sprechtempo'), h('div', { class: 'row' }, rate, rateV),
    h('label', { for: 'tier' }, 'Gesprächspartner'), tier,
    h('label', { class: 'toggle', for: 'autotts' }, auto, ' Lösungen automatisch vorlesen')));
  el.appendChild(sp);

  /* Daten */
  var dp = h('section', { class: 'panel' }, h('h2', { class: 'sub', text: 'Daten' }),
    h('p', { class: 'small muted', text: Store.online ? 'Fortschritt wird in Ihrem claude.ai-Konto gespeichert und ist auf Handy und PC gleich.' : 'Fortschritt wird nur auf diesem Gerät gespeichert.' }));
  var exp = h('button', { class: 'btn', type: 'button', text: 'Sicherung herunterladen' });
  exp.addEventListener('click', function () {
    var data = {}; DOCS.forEach(function (n) { data[n] = Store.get(n); });
    var json = JSON.stringify({ app: 'gutachter-deutsch', v: 1, at: Date.now(), data: data });
    (window.claude && claude.use ? claude.use('downloads') : Promise.resolve(null)).then(function (dl) {
      if (!dl) { toast('Herunterladen ist hier nicht möglich.'); return; }
      return dl.save({ filename: 'gutachter-deutsch-' + dayKey() + '.json', data: json });
    }).catch(function () { });
  });
  var imp = h('input', { type: 'file', id: 'imp', accept: 'application/json,.json' });
  imp.addEventListener('change', function () {
    var f = imp.files && imp.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var j = JSON.parse(r.result);
        if (j.app !== 'gutachter-deutsch') throw new Error('x');
        Object.keys(j.data).forEach(function (n) { Store.data[n] = j.data[n]; Store.save(n); });
        toast('Sicherung geladen'); App.go('heute');
      } catch (e) { toast('Diese Datei ist keine Sicherung dieser App.'); }
    };
    r.readAsText(f);
  });
  dp.appendChild(h('div', { class: 'row' }, exp, h('label', { class: 'btn ghost', for: 'imp' }, 'Sicherung laden', imp)));
  el.appendChild(dp);

  el.appendChild(h('section', { class: 'panel' }, h('h2', { class: 'sub', text: 'So funktioniert der Kurs' }),
    h('div', { class: 'ru small', html: '<p><b>Каждый день — 2 сессии по 45 минут.</b> Утром: повторение карточек, новые слова, грамматика, аудирование. Вечером: устный перевод, разговор с Claude, беглость 4/3/2, итоги.</p><p><b>Карточки</b> планируются по алгоритму FSRS: ответили легко — карточка вернётся позже, ошиблись — сегодня же. Отвечайте вслух, потом честно оценивайте.</p><p><b>Голосовой ввод</b>: на телефоне — микрофон на клавиатуре (Gboard), на Windows — Win + H. Распознавание речи иногда «исправляет» окончания, поэтому в грамматике лучше печатать.</p><p><b>Дни 1–14</b> подготовлены заранее, начиная с 15-го дня Claude готовит материалы по плану курса с учётом ваших ошибок (кнопка «Tag vorbereiten»).</p>' })));
};

/* ---------- Start ---------- */
function boot() {
  Store.load();
  var s = Store.get('settings'); if (!s.mode) s.mode = 'speak';
  TTS.init();
  App.main = $('#main');
  document.querySelectorAll('.nav button').forEach(function (b) { b.addEventListener('click', function () { App.go(b.dataset.v); }); });
  App.day = App.lessonDay();
  App.go('heute');
  var C = window.claude;
  /* n fehlt beim ersten Abgleich, sonst Name des geänderten Dokuments */
  Store.listeners.push(function (n) { if (!n && App.view === 'heute') App.day = App.lessonDay(); App.refresh(); });
  if (!C || !C.use) { AI.checked = true; Store.ready = true; App.refresh(); return; }
  C.use('sample').then(function (fn) { AI.fn = fn; AI.checked = true; App.refresh(); });
  var offline = function () { Store.ready = true; App.refresh(); };
  Promise.all([C.use('db'), C.use('user')]).then(function (r) {
    var db = r[0], user = r[1];
    if (!db || !user) return offline();
    return user.id().then(function (uid) {
      if (!uid) return offline();
      return Store.connect(db, uid).then(function () {
        $('#sync').classList.add('on'); $('#sync').title = 'Mit claude.ai synchronisiert';
      });
    });
  }).catch(offline);
}

boot();
</script>
